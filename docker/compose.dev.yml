services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: deps
    working_dir: /app
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://stb:stb@db:5432/stb
    ports:
      - '${HTTP_PORT:-3000}:3000'
    volumes:
      - ..:/app
      - /app/node_modules
    command: pnpm dev
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: stb
      POSTGRES_PASSWORD: stb
      POSTGRES_DB: stb
    ports:
      - '5433:5432'
    volumes:
      - stb-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stb -d stb']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stb-dev-pgdata:
