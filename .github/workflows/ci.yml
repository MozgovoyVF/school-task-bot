name: CI

on:
  push:
    branches: ['**']
  pull_request: {}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stb
          POSTGRES_PASSWORD: stb
          POSTGRES_DB: stb
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U stb" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # points at the postgres service above; the "stb_test" database is created by the app's
      # own migration/test setup, the service container only provisions the "stb" database.
      TEST_DATABASE_URL: postgres://stb:stb@localhost:5433/stb_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm coverage

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
