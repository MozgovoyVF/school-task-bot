name: Deploy

# Manual only: there is no VPS yet (SPEC §24), this workflow just needs to exist and be
# syntactically valid until Task 0.10's scripts/deploy.sh and the server are in place.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (matches a tag pushed by release.yml, e.g. v0.1.0)'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Run deploy script on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd /opt/stb-${{ inputs.environment }} && ./scripts/deploy.sh ${{ inputs.tag }}"
