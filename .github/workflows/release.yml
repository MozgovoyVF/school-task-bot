name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and push (e.g. v0.1.0 or v0.1.0-rc.1)'
        required: true
        type: string

permissions:
  packages: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

      - name: Resolve tag and whether ":latest" should be updated
        id: vars
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Release-candidate tags pushed via manual dispatch never become ":latest".
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$TAG" == *-rc* ]]; then
            echo "push_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "push_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned tag
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/mozgovoyvf/school-task-bot:${{ steps.vars.outputs.tag }}
          build-args: |
            GIT_SHA=${{ steps.vars.outputs.tag }}

      - name: Build and push ":latest"
        if: steps.vars.outputs.push_latest == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/mozgovoyvf/school-task-bot:latest
          build-args: |
            GIT_SHA=${{ steps.vars.outputs.tag }}
